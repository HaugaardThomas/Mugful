<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Mugful{% unless page.title %}: your coffee day, coloured in{% endunless %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#ECE4D3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2B241D" media="(prefers-color-scheme: dark)">
  <meta property="og:title" content="{{ page.title | default: 'Mugful' }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ '/assets/symbol-small.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ '/assets/app-icon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/gaegu-700.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/shantell-sans-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/sketch.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="wrap site-head">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Mugful home">{% include logo.svg %}</a>
    <nav aria-label="Site">
      <a href="{{ '/support/' | relative_url }}"{% if page.url == '/support/' %} aria-current="page"{% endif %}>Support</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="wrap site-foot">
    <div class="rule"></div>
    <div class="foot-grid">
      <div class="foot-who">
        {% include symbol.svg %}
        <p>Mugful is made by Thomas Haugaard,<br>an independent developer.</p>
      </div>
      <nav class="foot-links" aria-label="Footer">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
        <a href="{{ '/privacy/' | relative_url }}">Privacy policy</a>
        <a href="https://github.com/HaugaardThomas/Mugful/issues">Feedback on GitHub</a>
      </nav>
    </div>
  </footer>
</body>
</html>
